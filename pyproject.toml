[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolsplat4d"
version = "1.1.2"
description = "EVolSplat4D: Efficient Volume-based Gaussian Splatting for 4D Urban Scene Synthesis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "gsplat==1.3.0",
    "torchsparse==2.1.0",
    "pytorch3d==0.7.7",
    "numpy",
    "scipy",
    "scikit-learn",
    "kornia",
    "tyro>=0.6.6",
    "jaxtyping==0.2.19",
    "matplotlib>=3.6.0",
    "mediapy>=1.1.0",
    "opencv-python==4.8.0.76",
    "Pillow>=10.3.0",
    "PyYAML",
    "rich>=12.5.1",
    "tensorboard>=2.13.0",
    "torchmetrics[image]>=1.0.1",
    "typing_extensions>=4.4.0",
    "pytorch-msssim",
    "fpsample",
    "omegaconf==2.3.0",
    "easydict",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ruff==0.1.13", "pyright==1.1.331"]

[project.urls]
Homepage = "https://xdimlab.github.io/EVolSplat4D/"
Repository = "https://github.com/Miaosheng1/EVolSplat4D"
Paper = "https://arxiv.org/abs/2601.15951"

[project.scripts]
ns-train = "nerfstudio.scripts.train:entrypoint"

[tool.setuptools.packages.find]
include = ["nerfstudio*"]

[tool.setuptools.package-data]
"nerfstudio" = ["py.typed"]

[tool.pyright]
include = ["nerfstudio"]
exclude = ["**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }

reportMissingImports = "warning"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

[tool.ruff]
line-length = 120
respect-gitignore = false
select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "I",  # isort formatting.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
]
ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Globa statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["nerfstudio"]
split-on-trailing-comma = false
